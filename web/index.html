<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TamaPoke · 網頁自動燒錄器</title>
<style>
  :root {
    --bg: #f2efe1;
    --card: #ffffff;
    --ink: #2a2a36;
    --muted: #6b6b76;
    --accent: #3d7fb0;
    --accent-hover: #326a94;
    --ok: #47a458;
    --bad: #dc4a35;
    --warn-bg: #fff6f4;
    --safe-bg: #f2fbf4;
    --track: #d8d2bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  h2 { font-size: 1.2rem; margin: 2rem 0 .65rem; display: flex; align-items: center; }
  .sub { color: var(--muted); margin: 0 0 .85rem; }
  .badges { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .badge {
    display: inline-flex; align-items: center; gap: .35rem;
    font-size: .82rem; font-weight: 600; padding: .25rem .65rem;
    border-radius: 999px; background: #fff; border: 1px solid var(--track); color: var(--ink);
  }
  .badge.ok { background: var(--safe-bg); border-color: #b7e2bf; color: #246631; }
  .lang-btn {
    font: inherit; font-size: .88rem; font-weight: 600;
    padding: .4rem .85rem; border-radius: 999px;
    border: 1px solid var(--track); background: #fff; color: var(--ink); cursor: pointer;
  }
  .lang-btn:hover { background: #ebe6d3; }
  .step {
    background: var(--card); border: 1px solid var(--track);
    border-radius: 14px; padding: 1.25rem 1.4rem; margin: .85rem 0;
    box-shadow: 0 2px 8px rgba(42, 42, 54, 0.04);
  }
  .num {
    display: inline-flex; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: #fff; align-items: center; justify-content: center;
    font-weight: 700; margin-right: .6rem; font-size: .9rem; flex-shrink: 0;
  }
  button {
    font: inherit; font-weight: 600; padding: .6rem 1.15rem; border-radius: 10px;
    border: 1px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer;
    transition: background .12s, transform .05s;
  }
  button:hover:not(:disabled) { background: var(--bg); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    padding: .75rem 1.4rem; font-size: 1.02rem;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.safe { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.safe:hover:not(:disabled) { background: #3b8e4a; }
  esp-web-install-button { display: inline-block; }
  esp-web-install-button[install-unsupported] { display: none; }
  .unsupported {
    display: none; background: var(--warn-bg); border: 1px solid #f0b5ac;
    border-radius: 12px; padding: .9rem 1.1rem; color: var(--bad); font-weight: 600; margin: 1rem 0;
  }
  .callout {
    border-left: 4px solid var(--bad); background: var(--warn-bg);
    border-radius: 0 10px 10px 0; padding: .85rem 1rem; margin: .9rem 0 0; font-size: .93rem;
  }
  .callout.safe { border-left-color: var(--ok); background: var(--safe-bg); }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .logbox {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .83rem;
    background: #1b1b25; color: #d8dcf0; border-radius: 10px;
    padding: .75rem 1rem; margin-top: .85rem; max-height: 220px;
    overflow: auto; white-space: pre-wrap; display: none;
  }
  .bar { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; margin-top: .75rem; display: none; }
  .bar > div { height: 100%; width: 0; background: var(--ok); transition: width .15s; }
  code { background: rgba(0,0,0,.06); padding: .12em .4em; border-radius: 5px; font-size: .9em; }
  a { color: var(--accent); }
  .note { font-size: .9rem; color: var(--muted); }
  details { margin-top: .9rem; }
  details summary { cursor: pointer; font-weight: 600; color: var(--accent); user-select: none; }
  .bin-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .5rem; margin-top: .7rem; }
  .bin-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: .45rem .7rem; border: 1px solid var(--track); border-radius: 8px;
    background: #faf8f0; font-size: .86rem; text-decoration: none; color: var(--ink);
  }
  .bin-item:hover { background: var(--bg); }
  .bin-item span { color: var(--muted); font-family: ui-monospace, monospace; font-size: .8rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>🐢 TamaPoke</h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <button class="lang-btn" id="langToggle">English</button>
  </div>

  <div class="badges" id="badges">
    <span class="badge ok" id="fwBadge">ESP32-S3</span>
    <span class="badge" id="langBadge">繁體中文 + 6 國語言</span>
    <span class="badge" id="buildBadge" style="display:none"></span>
  </div>

  <div class="unsupported" id="unsupported" data-i18n-html="unsupported"></div>

  <div class="step" style="border-left:4px solid var(--bad);background:var(--warn-bg)">
    <p style="margin-top:0" data-i18n-html="dlTitle"></p>
    <p data-i18n-html="dlDesc"></p>
    <p style="font-size:1.05em;margin:.6rem 0" data-i18n-html="dlCombo"></p>
    <p class="note" style="margin-bottom:.35rem" data-i18n-html="dlNote1"></p>
    <p class="note" style="margin:0" data-i18n-html="dlNote2"></p>
  </div>

  <h2><span class="num">1</span><span data-i18n="s1Title"></span></h2>
  <div class="step">
    <p style="margin-top:0" data-i18n-html="s1Desc"></p>
    <div class="row">
      <esp-web-install-button manifest="manifest.json">
        <button slot="activate" class="primary" data-i18n="s1Btn"></button>
        <span slot="unsupported" data-i18n="s1Unsupported"></span>
        <span slot="not-allowed" data-i18n="s1Https"></span>
      </esp-web-install-button>
    </div>
    <div class="callout safe" data-i18n-html="s1Safe"></div>
    <details>
      <summary data-i18n="manualBins"></summary>
      <div class="bin-list">
        <a class="bin-item" href="firmware/app.bin" download><b>app.bin</b><span>0x10000</span></a>
        <a class="bin-item" href="firmware/bootloader.bin" download><b>bootloader.bin</b><span>0x0</span></a>
        <a class="bin-item" href="firmware/partitions.bin" download><b>partitions.bin</b><span>0x8000</span></a>
        <a class="bin-item" href="firmware/boot_app0.bin" download><b>boot_app0.bin</b><span>0xe000</span></a>
        <a class="bin-item" href="firmware/tamapoke.bin" download><b>tamapoke.bin</b><span>0x0 (merged)</span></a>
      </div>
      <p class="note" style="margin:.6rem 0 0" data-i18n-html="manualHint"></p>
    </details>
  </div>

  <h2><span class="num">2</span><span data-i18n="s2Title"></span></h2>
  <div class="step">
    <p style="margin-top:0" data-i18n-html="s2Desc"></p>
    <div class="row">
      <button id="backupBtn" class="safe" data-i18n="s2Backup"></button>
      <button id="restoreBtn" data-i18n="s2Restore"></button>
      <input id="restoreFile" type="file" accept=".txt" hidden>
    </div>
    <pre class="logbox" id="saveLog"></pre>
  </div>

  <h2><span class="num">3</span><span data-i18n="s3Title"></span></h2>
  <div class="step">
    <p style="margin-top:0" data-i18n-html="s3Desc"></p>
    <p class="note" data-i18n-html="s3Slow"></p>
    <p class="note" data-i18n-html="s3Close"></p>
    <div class="row" style="margin-bottom:.65rem">
      <button id="connect" class="primary" data-i18n="s3Connect"></button>
      <button id="disconnect" disabled data-i18n="s3Disconnect"></button>
    </div>
    <div class="row">
      <button id="auto"  data-region="kanto"  disabled data-i18n="rKanto"></button>
      <button id="autoj" data-region="johto"  disabled data-i18n="rJohto"></button>
      <button id="autoh" data-region="hoenn"  disabled data-i18n="rHoenn"></button>
      <button id="autos" data-region="sinnoh" disabled data-i18n="rSinnoh"></button>
      <button id="autou" data-region="unova"  disabled data-i18n="rUnova"></button>
      <button id="autok" data-region="kalos"  disabled data-i18n="rKalos"></button>
      <button id="autoa" data-region="alola"  disabled data-i18n="rAlola"></button>
    </div>
    <p class="note" style="margin-top:.85rem">
      <span data-i18n="s3Own"></span>
      <label style="cursor:pointer;text-decoration:underline">
        <span data-i18n="s3Pick"></span>
        <input id="files" type="file" accept=".bin" multiple disabled hidden>
      </label>
    </p>
    <div class="bar" id="bar"><div></div></div>
    <pre class="logbox" id="log"></pre>
  </div>

  <h2 data-i18n="howTitle"></h2>
  <p data-i18n-html="howDesc"></p>
  <p class="note" data-i18n-html="credits"></p>
  <p class="note" data-i18n-html="legal"></p>
</div>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js"></script>

    msgConnected: 'Connected. Pick a region below to upload compressed sprites.',

    msgRestoreFail: (r) => `Restore failed (${r || 'timeout'}). Check that the file is a TamaPoke backup.`,

let uiLang = 'zh';
function applyLang(l) {
  uiLang = l;
  document.documentElement.lang = (l === 'zh') ? 'zh-Hant' : 'en';
  const d = I18N[l];
  document.title = d.title;
  document.getElementById('langToggle').textContent = d.toggle;
  document.getElementById('langBadge').textContent = d.langBadge;
  for (const el of document.querySelectorAll('[data-i18n]')) {
    const k = el.dataset.i18n;
    if (d[k]) el.textContent = d[k];
  }
  for (const el of document.querySelectorAll('[data-i18n-html]')) {
    const k = el.dataset.i18nHtml;
    if (d[k]) el.innerHTML = d[k];
  }
}
document.getElementById('langToggle').onclick = () => applyLang(uiLang === 'zh' ? 'en' : 'zh');
applyLang('zh');

// Load firmware version & CI build info badges
(async () => {
  try {
    const m = await (await fetch('manifest.json', { cache: 'no-store' })).json();
    if (m.version) document.getElementById('fwBadge').textContent = `ESP32-S3 · v${m.version}`;
  } catch (e) {}
  try {
    const b = await (await fetch('build-info.json', { cache: 'no-store' })).json();
    const el = document.getElementById('buildBadge');
    el.textContent = `${b.branch || 'zhtz-1.75c'} @ ${(b.sha || '').slice(0, 7)} · ${b.builtAt || ''}`;
    el.style.display = 'inline-flex';
  } catch (e) {}
})();

const supported = 'serial' in navigator;
if (!supported) {
  document.getElementById('unsupported').style.display = 'block';
  document.getElementById('connect').disabled = true;
  document.getElementById('backupBtn').disabled = true;
  document.getElementById('restoreBtn').disabled = true;
}

const enc = new TextEncoder();
const dec = new TextDecoder();

function appendLog(id, msg) {
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}
const log = (m) => appendLog('log', m);
const saveLog = (m) => appendLog('saveLog', m);

// Helper to open/close a temporary Web Serial session for backup/restore
async function withTempPort(fn) {
  let p, r, w;
  try {
    p = await navigator.serial.requestPort();
    await p.open({ baudRate: 115200 });
    r = p.readable.getReader();
    w = p.writable.getWriter();
    let buf = '';
    async function readLine(timeoutMs = 5000) {
      const deadline = Date.now() + timeoutMs;
      while (true) {
        const nl = buf.indexOf('\n');
        if (nl >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          return line;
        }
        const rem = deadline - Date.now();
        if (rem <= 0) return null;
        const res = await Promise.race([
          r.read(),
          new Promise((resolve) => setTimeout(() => resolve({ timeout: true }), rem))
        ]);
        if (res.timeout || res.done) return null;
        buf += dec.decode(res.value);
      }
    }
    await fn({ write: (s) => w.write(enc.encode(s)), readLine });
  } finally {
    try { if (r) { await r.cancel(); r.releaseLock(); } } catch (e) {}
    try { if (w) { w.releaseLock(); } } catch (e) {}
    try { if (p) { await p.close(); } } catch (e) {}
  }
}

document.getElementById('backupBtn').onclick = async () => {
  const d = I18N[uiLang];
  try {
    await withTempPort(async ({ write, readLine }) => {
      saveLog(d.msgBackupStart);
      await write('\nEXPORT\n');
      const lines = [];
      let gotEnd = false;
      const deadline = Date.now() + 8000;
      while (Date.now() < deadline) {
        const l = await readLine(2500);
        if (l === null) break;
        if (l === 'EXPORT FAIL') break;
        if (l.startsWith('# TamaPoke save') || l.startsWith('IMPORT')) {
          lines.push(l);
          if (l === 'IMPORT') { gotEnd = true; break; }
        }
      }
      if (!gotEnd || lines.length < 2) {
        saveLog(d.msgBackupFail);
        return;
      }
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const fname = `tamapoke-save-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.txt`;
      const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      a.click();
      URL.revokeObjectURL(a.href);
      saveLog(d.msgBackupOk(fname, lines.length));
    });
  } catch (e) {
    saveLog(d.msgConnFail + e.message);
  }
};

document.getElementById('restoreBtn').onclick = () => {
  document.getElementById('restoreFile').value = '';
  document.getElementById('restoreFile').click();
};

document.getElementById('restoreFile').onchange = async (ev) => {
  const d = I18N[uiLang];
  const file = ev.target.files[0];
  if (!file) return;
  const text = await file.text();
  const lines = text.split(/\r?\n/).map((s) => s.trim()).filter((s) => s.startsWith('IMPORT'));
  if (lines.length < 2 || lines[lines.length - 1] !== 'IMPORT') {
    saveLog(d.msgBadFile);
    return;
  }
  try {
    await withTempPort(async ({ write, readLine }) => {
      saveLog(d.msgRestoreStart(lines.length));
      for (const l of lines) {
        await write(l + '\n');
        await new Promise((res) => setTimeout(res, 25));
      }
      let resp = null;
      const deadline = Date.now() + 6000;
      while (Date.now() < deadline) {
        const l = await readLine(2000);
        if (l === null) break;
        if (l.startsWith('IMPORT ')) { resp = l; break; }
      }
      if (resp === 'IMPORT OK') saveLog(d.msgRestoreOk);
      else saveLog(d.msgRestoreFail(resp));
    });
  } catch (e) {
    saveLog(d.msgConnFail + e.message);
  }
};

// Step 3: Sprite uploader over Web Serial (PUT protocol)
let port, reader, writer, lineBuf = '';

async function readLine(timeoutMs = 6000) {
  const deadline = Date.now() + timeoutMs;
  while (true) {
    const nl = lineBuf.indexOf('\n');
    if (nl >= 0) { const l = lineBuf.slice(0, nl).trim(); lineBuf = lineBuf.slice(nl + 1); return l; }
    if (Date.now() > deadline) return null;
    const { value, done } = await reader.read();
    if (done) return null;
    lineBuf += dec.decode(value);
  }
}

async function waitFor(token, timeoutMs = 6000) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    const l = await readLine(deadline - Date.now());
    if (l === null) return false;
    if (l === token) return true;
    if (l === 'ERR') return false;
  }
  return false;
}

async function sendOne(name, data) {
  await writer.write(enc.encode(`PUT ${name} ${data.length}\n`));
  if (!await waitFor('OK')) return false;
  for (let i = 0; i < data.length; i += 2048) {
    await writer.write(data.slice(i, i + 2048));
    if (!await waitFor('#')) return false;
  }
  return await waitFor('DONE', 30000);
}

function parsePak(buf) {
  const dv = new DataView(buf), td = new TextDecoder();
  if (td.decode(new Uint8Array(buf, 0, 4)) !== 'TPAK') throw new Error('invalid bundle');
  const count = dv.getUint16(4, true);
  let off = 6; const items = [];
  for (let i = 0; i < count; i++) {
    const nl = dv.getUint8(off); off += 1;
    const name = td.decode(new Uint8Array(buf, off, nl)); off += nl;
    const size = dv.getUint32(off, true); off += 4;
    items.push({ name, size });
  }
  let pos = off;
  for (const it of items) { it.data = new Uint8Array(buf, pos, it.size); pos += it.size; }
  return items;
}

async function sendAll(items) {
  const bar = document.getElementById('bar'); bar.style.display = 'block';
  const fill = bar.firstElementChild;
  let done = 0, fail = 0;
  for (const it of items) {
    if (!await sendOne(it.name, it.data)) { log('   failed ' + it.name); fail++; }
    done++;
    fill.style.width = (done / items.length * 100) + '%';
  }
  log(I18N[uiLang].msgAllDone(done - fail, items.length));
}

function setConnectedUi(connected) {
  document.getElementById('connect').disabled = connected || !supported;
  document.getElementById('disconnect').disabled = !connected;
  document.getElementById('files').disabled = !connected;
  for (const b of document.querySelectorAll('[data-region]')) b.disabled = !connected;
}

document.getElementById('connect').onclick = async () => {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    reader = port.readable.getReader();
    writer = port.writable.getWriter();
    lineBuf = '';
    log(I18N[uiLang].msgConnected);
    setConnectedUi(true);
    probeRegions();
  } catch (e) { log(I18N[uiLang].msgConnFail + e.message); }
};

document.getElementById('disconnect').onclick = async () => {
  try { if (reader) { await reader.cancel(); reader.releaseLock(); } } catch (e) {}
  try { if (writer) { writer.releaseLock(); } } catch (e) {}
  try { if (port) { await port.close(); } } catch (e) {}
  port = reader = writer = null;
  setConnectedUi(false);
  log(I18N[uiLang].msgDisconnected);
};

function pakUrls(region) {
  return [`sprites-${region}.pak`];
}

async function fetchPak(region) {
  let last;
  for (const url of pakUrls(region)) {
    try {
      const resp = await fetch(url);
      if (resp.ok) return await resp.arrayBuffer();
      last = new Error('HTTP ' + resp.status);
    } catch (e) { last = e; }
  }
  throw last || new Error('not found');
}

async function probeRegions() {
  for (const b of document.querySelectorAll('[data-region]')) {
    const region = b.dataset.region;
    let found = false;
    for (const url of pakUrls(region)) {
      try {
        const r = await fetch(url, { method: 'HEAD' });
        if (r.ok) { found = true; break; }
      } catch (e) {}
    }
    if (!found) {
      b.disabled = true;
      b.textContent = b.textContent.replace(/^⬇️ /, '').replace(/ \(.*\)$/, '') + I18N[uiLang].notPublished;
    }
  }
}

async function loadRegion(btn) {
  const d = I18N[uiLang];
  const region = btn.dataset.region;
  if (!writer) { log(d.msgConnectFirst); return; }
  btn.disabled = true;
  log(d.msgDownloading(region));
  let items;
  try {
    items = parsePak(await fetchPak(region));
  } catch (e) {
    log(d.msgDlFail(region, e.message));
    btn.disabled = false;
    return;
  }
  log(d.msgSending(items.length, region));
  await sendAll(items);
  log(d.msgRegionDone(region));
}
for (const b of document.querySelectorAll('[data-region]')) b.onclick = () => loadRegion(b);

document.getElementById('files').onchange = async (ev) => {
  const files = [...ev.target.files];
  const items = [];
  for (const f of files) items.push({ name: 'mons/' + f.name, data: new Uint8Array(await f.arrayBuffer()) });
  log(`${items.length} files...`);
  await sendAll(items);
};
