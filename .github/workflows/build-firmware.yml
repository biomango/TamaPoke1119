name: Build ESP32-S3 Firmware (.bin) & Deploy Web Installer

on:
  push:
    branches: [main, zhtz, zhtz-1.75c]
  pull_request:
  workflow_dispatch:
    inputs:
      update_web_firmware:
        description: "Also commit compiled .bin files into web/firmware/ on this branch"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FQBN: "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=32M,PSRAM=opi,PartitionScheme=app5M_little24M_32MB"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # arduino-cli requires the sketch directory name to match TamaPoke.ino
          path: TamaPoke

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-s3-3.3-v1

      - name: Install ESP32 core and Arduino libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          ESP32_VER="$(arduino-cli core search esp32:esp32 --all | awk '$1=="esp32:esp32" && $2 ~ /^3\.3\.[0-9]+$/ {print $2}' | sort -V | tail -1)"
          echo "Installing esp32:esp32@${ESP32_VER}"
          arduino-cli core install "esp32:esp32@${ESP32_VER}"
          arduino-cli lib install "GFX Library for Arduino" "SensorLib" "XPowersLib"

      - name: Compile firmware (.bin)
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --export-binaries \
            TamaPoke

      - name: Package .bin files and verify save safety
        run: |
          set -euo pipefail
          B="TamaPoke/build/esp32.esp32.esp32s3"
          mkdir -p out

          BOOT_APP0="$B/boot_app0.bin"
          if [ ! -f "$BOOT_APP0" ]; then
            BOOT_APP0="$(ls -1 ~/.arduino15/packages/esp32/hardware/esp32/*/tools/partitions/boot_app0.bin | head -1)"
          fi

          cp "$B/TamaPoke.ino.bootloader.bin" out/bootloader.bin
          cp "$B/TamaPoke.ino.partitions.bin" out/partitions.bin
          cp "$BOOT_APP0"                     out/boot_app0.bin
          cp "$B/TamaPoke.ino.bin"            out/app.bin

          ESPTOOL="$(ls -1 ~/.arduino15/packages/esp32/tools/esptool_py/*/esptool 2>/dev/null | head -1 || true)"
          if [ -z "$ESPTOOL" ]; then
            ESPTOOL="$(ls -1 ~/.arduino15/packages/esp32/tools/esptool_py/*/esptool.py 2>/dev/null | head -1 || true)"
          fi
          if [ -n "$ESPTOOL" ]; then
            "$ESPTOOL" --chip esp32s3 merge-bin -o out/tamapoke.bin \
              0x0     out/bootloader.bin \
              0x8000  out/partitions.bin \
              0xe000  out/boot_app0.bin \
              0x10000 out/app.bin || \
            "$ESPTOOL" --chip esp32s3 merge_bin -o out/tamapoke.bin \
              0x0     out/bootloader.bin \
              0x8000  out/partitions.bin \
              0xe000  out/boot_app0.bin \
              0x10000 out/app.bin
          elif [ -f "$B/TamaPoke.ino.merged.bin" ]; then
            cp "$B/TamaPoke.ino.merged.bin" out/tamapoke.bin
          fi

          # Overlay freshly built binaries into TamaPoke/web/firmware/ and verify
          # the web installer manifest cannot overwrite NVS (0x9000..0xE000).
          cp out/bootloader.bin TamaPoke/web/firmware/bootloader.bin
          cp out/partitions.bin TamaPoke/web/firmware/partitions.bin
          cp out/boot_app0.bin  TamaPoke/web/firmware/boot_app0.bin
          cp out/app.bin        TamaPoke/web/firmware/app.bin
          if [ -f out/tamapoke.bin ]; then
            cp out/tamapoke.bin TamaPoke/web/firmware/tamapoke.bin
          fi
          python3 TamaPoke/tools/check_installer.py

          # Emit build-info.json for the web installer badge
          FW_VER="$(grep -o '"[0-9.]*"' TamaPoke/TamaPoke.ino | head -1 | tr -d '"')"
          BUILT_AT="$(date -u +'%Y-%m-%d %H:%M UTC')"
          python3 - "$FW_VER" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "$BUILT_AT" << 'PY'
          import json, sys
          json.dump({
              "version": sys.argv[1],
              "branch": sys.argv[2],
              "sha": sys.argv[3],
              "builtAt": sys.argv[4],
          }, open("TamaPoke/web/build-info.json", "w"), indent=2)
          PY

          ls -lh out/
          {
            echo "## TamaPoke ESP32-S3 Firmware Build"
            echo ""
            echo "| File | Flash Offset | Size |"
            echo "|---|---|---|"
            echo "| \`bootloader.bin\` | \`0x0\` | $(stat -c%s out/bootloader.bin) bytes |"
            echo "| \`partitions.bin\` | \`0x8000\` | $(stat -c%s out/partitions.bin) bytes |"
            echo "| \`boot_app0.bin\` | \`0xe000\` | $(stat -c%s out/boot_app0.bin) bytes |"
            echo "| \`app.bin\` | \`0x10000\` | $(stat -c%s out/app.bin) bytes |"
            if [ -f out/tamapoke.bin ]; then
              echo "| \`tamapoke.bin\` (merged, erases NVS if flashed to 0x0) | \`0x0\` | $(stat -c%s out/tamapoke.bin) bytes |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware .bin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tamapoke-firmware-${{ github.ref_name }}
          path: out/*.bin
          if-no-files-found: error

      - name: Setup GitHub Pages
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'zhtz' || github.ref_name == 'main') }}
        uses: actions/configure-pages@v5

      - name: Upload web installer site for GitHub Pages
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'zhtz' || github.ref_name == 'main') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: TamaPoke/web

      - name: Update web/firmware/ in git (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_web_firmware }}
        working-directory: TamaPoke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/firmware/*.bin
          if ! git diff --cached --quiet; then
            git commit -m "Update compiled web/firmware binaries from CI"
            git push
          fi

  deploy-pages:
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'zhtz' || github.ref_name == 'main') }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy web installer to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
